services:
  - type: web
    name: stockflow
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run db:generate --prefix backend && npm run build --prefix frontend
    startCommand: npm run db:push --prefix backend && npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-db
          property: connectionString
      - key: VITE_API_URL
        value: /api

databases:
  - name: stockflow-db
    databaseName: stockflow
    user: stockflow
    plan: free
